set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*:RGB"
set -gq extended-keys on



set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

set -s escape-time 0

# Enable Vi mode for scrolling and copying
set-window-option -g mode-keys vi
set -g set-clipboard on

# Make tmux copy mode feel closer to Vim.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'"

# Vim-style pane selection
bind -r k if -F '#{pane_at_top}' 'display-message "Already at top pane"' 'select-pane -U'
bind -r j if -F '#{pane_at_bottom}' 'display-message "Already at bottom pane"' 'select-pane -D'
bind -r h if -F '#{pane_at_left}' 'display-message "Already at leftmost pane"' 'select-pane -L'
bind -r l if -F '#{pane_at_right}' 'display-message "Already at rightmost pane"' 'select-pane -R'

# Resize panes with prefix + arrows or prefix + H/J/K/L.
# Lowercase h/j/k/l are kept for pane navigation above.
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 3
bind -r J resize-pane -D 3
set -g repeat-time 1000

# Easy config reload
bind r source-file ~/.tmux.conf

# Toggle a bottom terminal pane for the current tmux window (Alt-i / Cmd-i in Alacritty).
bind -n M-i run-shell 'pane=$(tmux show-window-options -v @bottom_terminal_pane 2>/dev/null); if [ -n "$pane" ] && tmux display-message -p -t "$pane" "#{pane_id}" >/dev/null 2>&1; then tmux kill-pane -t "$pane"; tmux set-window-option -u @bottom_terminal_pane; else pane=$(tmux split-window -P -F "##{pane_id}" -v -p 30 -c "#{pane_current_path}"); tmux set-window-option @bottom_terminal_pane "$pane"; fi'

# Enable mouse for easy scrolling
set -g mouse on

# Scrollback
set -g history-limit 50000

# New splits/windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Monochrome theme (matches carbonfox in nvim)
set -g status-interval 5
set -g status-style "bg=#161616,fg=#a2a9b0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#161616,bg=#a2a9b0,bold] #S #[default] "
set -g status-right "#[fg=#787f87]#{?client_prefix,PREFIX ,}#[fg=#a2a9b0]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /')  #[fg=#787f87]%a %d %b  #[fg=#f2f4f8]%H:%M "
set -g window-status-format "#[fg=#787f87] #I #W "
set -g window-status-current-format "#[fg=#f2f4f8,bold,bg=#262626] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#a2a9b0"
set -g message-style "bg=#262626,fg=#f2f4f8"
set -g mode-style "bg=#393939,fg=#f2f4f8"

# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-logging'

# Persist sessions automatically and restore them on tmux start.
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Keep tpm at the bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
